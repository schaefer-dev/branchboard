name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history, not just the last commit

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          cd "$install_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --retry 3 --output "$archive" "$release/$archive"
          curl --fail --location --retry 3 --output "$checksums" "$release/$checksums"
          sha256sum --check --ignore-missing "$checksums"
          tar -xzf "$archive" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan full Git history
        run: >-
          gitleaks git . --log-opts="--all --full-history -m"
          --redact=100 --exit-code=2 --report-format=sarif
          --report-path="$RUNNER_TEMP/gitleaks-results.sarif"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-results
          path: ${{ runner.temp }}/gitleaks-results.sarif
          if-no-files-found: ignore
