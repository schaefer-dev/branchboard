name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare draft release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches the app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          package = json.loads(Path("package.json").read_text())["version"]
          tag = os.environ["RELEASE_TAG"]
          if cargo != package or tag != f"v{cargo}":
              raise SystemExit(f"Version mismatch: tag={tag}, Cargo={cargo}, package.json={package}")
          PY

      - name: Create or reuse the draft
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            python3 -c 'import json, sys; sys.exit(0 if json.load(open(sys.argv[1]))["isDraft"] else "Refusing to change a published release")' "$RUNNER_TEMP/release.json"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Branchboard $RELEASE_TAG" --generate-notes \
              --notes-file .github/release-notes.md
          fi
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id)
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned Rust toolchain and target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Failed-job reruns may skip prepare, so check the release again here.
      - name: Require an unpublished draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)" != true ]; then
            echo "::error::Refusing to upload to a published release. Use a new patch version."
            exit 1
          fi

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Install tauri-driver
        if: runner.os == 'Windows'
        run: cargo install tauri-driver --locked --version 2.1.0

      - name: Set up matching WebView2 driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/setup-webdriver.ps1

      - name: Verify installation without administrator rights
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/test-windows-installer.ps1

      - name: Upload Windows release diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: release-results-${{ matrix.target }}
          path: e2e-results/
          if-no-files-found: ignore
