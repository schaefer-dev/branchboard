name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Export TS bindings
        run: pnpm bindings

      - name: TS bindings are up to date
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- ui/src/lib/api/generated)" ]; then
            git status --short -- ui/src/lib/api/generated
            echo "::error::Generated TS bindings are stale. Run 'pnpm bindings' and commit the result."
            exit 1
          fi

      - name: Rust tests
        run: cargo test --workspace

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend type check
        run: pnpm check

      - name: Frontend tests
        run: pnpm test

      - name: Smoke harness tests
        run: pnpm smoke:harness

      # The fixtures record real git output; one platform is the reference.
      - name: E2E fixtures are up to date
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pnpm fixtures
          if [ -n "$(git status --porcelain -- ui/e2e/fixtures)" ]; then
            git diff -- ui/e2e/fixtures
            echo "::error::E2E fixtures are stale. Run 'pnpm fixtures' and commit the result."
            exit 1
          fi

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium webkit

      - name: UI end-to-end tests
        run: pnpm e2e

      - name: Upload E2E screenshots and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.os }}
          path: e2e-results/
          if-no-files-found: ignore

      - name: Build app
        run: pnpm tauri build --debug --no-bundle

      # Full-stack smoke test of the real app. tauri-driver supports Windows
      # (WebView2 via msedgedriver) but not macOS.
      - name: Install tauri-driver
        if: runner.os == 'Windows'
        run: cargo install tauri-driver --locked --version 2.1.0

      - name: Set up matching WebView2 driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/setup-webdriver.ps1

      - name: Full-stack smoke test
        if: runner.os == 'Windows'
        run: pnpm smoke

      - name: Upload smoke-test diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results-${{ matrix.os }}
          path: e2e-results/smoke/
          if-no-files-found: ignore
