[package]
name = "branchboard"
description = "Branchboard – a lean git GUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "branchboard_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
git-core.workspace = true
herdr.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
workspace.workspace = true

[dev-dependencies]
interprocess.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "macros", "rt"] }

[lints]
workspace = true
