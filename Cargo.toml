[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
git-core = { path = "crates/git-core" }
highlight = { path = "crates/highlight" }
workspace = { path = "crates/workspace" }

dunce = "1.0.5"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"
tempfile = "3.27.0"
trash = "5.2.9"
tree-sitter = "0.27.1"
tree-sitter-highlight = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-containerfile = "0.9.2"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-md = { version = "0.5.3", default-features = false }
tree-sitter-python = "0.25.0"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
uuid = { version = "1.28.0", features = ["v4"] }

tauri = { version = "2.12.3", features = [] }
tauri-build = { version = "2.7.2", features = [] }
tauri-plugin-dialog = "2.8.2"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
